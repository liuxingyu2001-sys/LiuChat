# ============================================================
#  LiuChat 配置
#  修改后执行 /lc reload 生效（server / storage 节建议重启生效）
# ============================================================

# 子服标识，群组服里区分消息来源，格式化时用 ${server} 引用
# 跨服聊天时收端显示的也是发送端的该值 —— 每个子服必须配成不同值
server: "lobby"

# 聊天格式，支持 & 颜色
# 可用内部变量: ${server} ${player} ${world} ${message}
# 同时支持 PlaceholderAPI 变量（装了 PAPI 才生效，跨服消息除外：
# 发送端玩家不在本服，无法解析以玩家为上下文的 PAPI 变量）
format: "&8[${server}] &e${player}&8» &f${message}"

# 控制台看到的格式，变量同上
console-format: "&8[${server}] &7[控制台] &e${player}&8» &f${message}"

# ------------------------------------------------------------
# 跨服聊天（群组服）
# 走 BungeeCord plugin messaging（BungeeCord / Velocity 均原生支持），
# 消息经代理转发到其他子服，由各子服按自己的 format 渲染。
# 单服/无代理环境开着也没影响：转发无人接收，静默丢弃。
# ------------------------------------------------------------
cross-server:
  enable: true
  # 所有子服必须使用相同的高强度随机密钥；为空时跨服功能关闭
  secret: ''

# 冲突指令优先交给 LiuChat。可在 /lc reload 后生效；关闭则交由 CMI/其他插件自行处理。
commands:
  prefer-liuchat: true

# 审核不阻塞发言；本地规则即时拦截，AI 每小时汇总本服公开聊天并生成报告。
ai:
  enable: false
  url: ''
  api-key: ''
  model: ''
  review:
    enable: false # 每小时审核历史；不影响普通聊天速度
    manual-enable: true # 管理员可用 /lc audit <1-24> 手动审查
    private-chat: true # 将私聊纳入历史审查，仍只写入本地审查文件
    interval-minutes: 60 # 定时审查最近一小时；/lc reload 生效
    timeout-seconds: 90
    prompt: '审核 Minecraft 聊天记录，识别违规发言并返回结构化 JSON。'
    keywords: [广告, 代充, 加群, 私服, cnm] # 所有屏蔽词直接拦截，不请求 AI；支持 * 和 ?
    contacts: true # 数字联系方式直接屏蔽
    block-ips: true # 有效 IPv4 与 IPv4:端口直接屏蔽，不请求 AI
    block-domains: true # 域名、域名:端口、URL 中的域名直接屏蔽
  assistant:
    enable: false
    url: '' # 留空时沿用 ai.url；可填 /v1 或完整 /v1/chat/completions
    api-key: '' # 留空时沿用 ai.api-key，再回退 LIUCHAT_AI_API_KEY
    model: '' # 留空时沿用 ai.model
    prompt: '你是 Minecraft 服务器聊天助手。简洁回答玩家的问题。不要声称已执行游戏内操作。'
    # 注意：prompt + skill 会原样作为请求的第一条 system 消息且每次全量重发。
    # 保持它逐字节不变，才能命中 OpenAI/DeepSeek/Kimi 等服务的前缀缓存（命中部分约 1/10 计价）；
    # 不要往 system 里拼时间戳、玩家名等动态内容，skill 内容也尽量少改。
    max-question: 300
    max-answer: 600
    dialog-width: 520 # AI Dialog 回答正文宽度，范围 100-800
    timeout-seconds: 60 # 助手生成较长回答时可调至 30~120 秒
    default: bot # /lc ask <问题> 使用此助手（机器读的 ID）
    name: '聊天助手' # 助手显示名称：回答前缀 [名称]、/liuc dialog ai 标题用
    answer-prefix: true # 回答前加 [显示名] 前缀；false = 只发正文
    # ---------------- 省 token ----------------
    # 单次回答的输出 token 上限，0 = 不限制。
    # 超出 max-answer 的部分本来就会被截掉不显示，模型却已经生成并计费，这里直接不让它生成。
    max-tokens: 1024
    # 相同问题（且配置、上下文都相同）在该时间内直接返回缓存答案，不请求模型 = 0 token，0 = 关闭。
    cache-seconds: 300
    # 多轮上下文：按助手名共享一份会话，全服玩家共用（多个 NPC 绑同一助手 = 同一份上下文，
    # /lc ask、/lc dialog ai、NPC 右键都接在同一条会话上）。请求与回答各算 1 条消息。
    history-messages: 20 # 会话最多保留多少条消息，超出从最旧开始丢，0 = 关闭上下文
    history-chars: 4000 # 上下文字符预算，超出从最旧开始丢，0 = 不限制
    history-seconds: 0 # 会话闲置多少秒后清空，0 = 永不过期；设个 600~3600 能进一步省 token
    history-persist: true # 会话写入 plugins/LiuChat/ai-sessions.json，重启不丢
    profiles:
      bot:
        skill: '' # 填 plugins/LiuChat/skills 下的子目录名，例如 bot
        name: '' # 该助手的自定义显示名称（如 久久酱），留空用 ai.assistant.name
      # guide:
      #   skill: guide
      #   name: '游玩指南'
    default-skill: '' # 老配置兼容；未设置默认助手 skill 时使用
  # 公屏 AI 聊天：AI 像普通玩家一样参与公共聊天。需要 ai.enable 与 ai.assistant.enable。
  # 公屏点名（@AI 或消息里提到它的名字）就回复，回答以它的玩家名走正常聊天渲染（本服 + 跨服）。
  chat:
    enable: false
    name: '小派蒙' # 公屏里 AI 的玩家名（固定虚拟 UUID，跨服一致；/lc ignore 也能屏蔽它）
    assistant: '' # 用 ai.assistant.profiles 里的哪个助手（机器读的 ID）；留空用 ai.assistant.default
    chance: 0.0 # 没点名也插话的概率 0~1（0 = 只在被点名时回复；想让它日常搭话可设 0.05~0.2）
    cooldown-seconds: 10 # 全局回复冷却，防刷屏
    respond-remote: false # 是否响应其他子服的公屏消息；多台服都开 AI 时保持 false 避免同时抢答
    max-answer: 200 # 公屏一行回复长度上限（像玩家说话，别太长）
    context-messages: 12 # 带多少条最近公屏消息作为聊天氛围上下文，0 = 不带
    # 公屏聊天格式（固定）：只替换 ${player} = AI 名字、${message} = 回复内容，
    # 不解析聊天格式节点、PAPI 变量与其他占位符（假人拿不到占位符输出）。
    # 支持 & 色码与 MiniMessage 混写（如 <gradient:#afd9c2:#97e1cb>渐变</gradient>）；
    # ${head} 显示头像（可用 head-uuid 指定真实玩家皮肤），回复内容原样显示，不解析色码/占位符/标签。
    # AI 回复跨服时携带发送服的格式与头像设置，接收服不会套用自己的配置
    format: '&7[AI] &b${player}&7: &f${message}'
    head-uuid: '' # ${head} 的皮肤 UUID；留空用 AI 虚拟 UUID（可能显示默认皮肤），可填真实玩家 UUID
    # 提问拼接受 ai.assistant.max-question 限制（默认 300），想带更多上下文把它调大（上限 2000）

# 每日聊天记录：plugins/LiuChat/logs/YYYY-MM-DD.log
chat-log:
  enable: true
  format: '[${time}] [${type}] [${server}] ${player} -> ${target}: ${message}'

  # 全服喇叭：/liuc horn <内容>，需要 liuchat.horn 权限和喇叭余额。
horn:
  format: "&6[全服喇叭] &e${player}&7: &f${message}"
  modes: [chat, title, actionbar, bossbar]
  title: '&6全服喇叭'
  sound: 'BLOCK_NOTE_BLOCK_BELL' # 留空关闭
  duration-ticks: 100

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  # sqlite = 本地文件（plugins/LiuChat/liuchat.db），单服用
  # mysql  = 共享数据库，跨服禁言/解禁需要各子服连同一个库
  type: sqlite
  # 每隔多少秒与数据库对账刷新一次禁言缓存
  # （拿到其他子服写入的禁言/解禁），0 = 关闭
  sync-interval: 30
  mysql:
    host: localhost
    port: 3306
    database: liuchat
    username: root
    password: ""
    # 追加到 jdbc url 的参数
    properties: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"

# ------------------------------------------------------------
# 聊天冷却，单位秒，0 = 关闭
# 可为不同权限节点单独配置，节点的值直接覆盖 default：
#   权限 liuchat.cooldown.vip1 -> 用 vip1 的值
# 拥有 liuchat.cooldown.bypass 权限直接免除冷却
# ------------------------------------------------------------
chat-cooldown:
  default: 0
  # vip1: 5

# ------------------------------------------------------------
# 重复/相似发言检测
# ------------------------------------------------------------
repeat-check:
  # 检测时间窗口（秒），0 = 关闭；上次发言超过该窗口则不再比较
  time: 30
  # 相似度百分比，100 = 必须完全一致才拦截
  similarity: 95
  # 参与相似度比较的最短消息长度，短于该长度只拦完全相同的；0 = 完全相同也拦
  min-length: 5
  # 含 [i] 物品展示的消息整条跳过：每次展示的物品都可能不同，同文案不算刷屏
