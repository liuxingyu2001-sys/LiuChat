# ============================================================
#  LiuChat 配置
#  修改后执行 /lc reload 生效（server / storage 节建议重启生效）
# ============================================================

settings:
  # 从本地 config.yml 读取；变更需重启。留空自动检测 /mc/shared/liuchat-config，目录不存在则使用本地。
  shared-config-path: ''
  # 单独共享 AI skills；留空使用实际配置目录下的 skills/。从本地读取，变更需重启。
  shared-skills-path: ''
  # 每 10 秒检测配置变化；默认关闭，可通过 /lc reload 更新开关。
  auto-reload-config: false

# 子服标识，群组服里区分消息来源，格式化时用 ${server} 引用
# 跨服聊天时收端显示的也是发送端的该值 —— 每个子服必须配成不同值
server: "lobby"

# 聊天格式，支持 & 颜色
# 可用内部变量: ${server} ${player} ${world} ${message}
# 同时支持 PlaceholderAPI 变量（装了 PAPI 才生效，跨服消息除外：
# 发送端玩家不在本服，无法解析以玩家为上下文的 PAPI 变量）
format: "&8[${server}] &e${player}&8» &f${message}"

# 控制台看到的格式，变量同上
console-format: "&8[${server}] &7[控制台] &e${player}&8» &f${message}"

# ------------------------------------------------------------
# 跨服聊天（群组服）
# 走 BungeeCord plugin messaging（BungeeCord / Velocity 均原生支持），
# 消息经代理转发到其他子服，由各子服按自己的 format 渲染。
# 单服/无代理环境开着也没影响：转发无人接收，静默丢弃。
# ------------------------------------------------------------
cross-server:
  enable: true
  # 所有子服必须使用相同的高强度随机密钥；为空时跨服功能关闭
  secret: ''

# 冲突指令优先交给 LiuChat。可在 /lc reload 后生效；关闭则交由 CMI/其他插件自行处理。
commands:
  prefer-liuchat: true

# ------------------------------------------------------------
# 聊天本地过滤（全服共享策略；纯本地规则，不请求 AI）
# 命中直接拦截，与 AI 审核/助手无关（那些在本地 ai.yml）
# ------------------------------------------------------------
chat-filter:
  enable: false # 本地屏蔽总开关；不影响 ai.yml 里的 AI 审核与助手
  # match 任意一词命中即拦截；all 每组词全部命中即拦截，任意一组成立即可
  # 支持 * (0-8 字符)、? (1 字符)；普通字符间允许插入 0-2 字符
  keywords:
    match: [
      代充, 加群, 私服, 出号, RMB交易,
      cnm, 傻逼, sb, fuck,
      你妈, 你爹, 操你妈, 草泥马, 草你妈,
      泥马隔壁, 杂种, 傻屌, 傻鸟, 狗逼, 狗叫,
      弱智, 智障, 脑残, 废物, 垃圾,
      小丑, 人机, 滚, 闭嘴, 破防, 急了,
      玻璃心, 小学生, 菜鸟, 有本事,
      跑路实锤, 退游, 倒闭
    ]

    all: []
  contacts: true # 数字联系方式直接屏蔽
  block-ips: true # 有效 IPv4 与 IPv4:端口直接屏蔽
  block-domains: true # 域名、域名:端口、URL 中的域名直接屏蔽

# 每日聊天记录：plugins/LiuChat/logs/YYYY-MM-DD.log
chat-log:
  enable: true
  # 可选共享记录目录；留空保留本地。按子服标识隔离 logs/ 和 audit-history/，不共享数据库或会话。
  shared-path: ''
  format: '[${time}] [${type}] [${server}] ${player} -> ${target}: ${message}'

  # 全服喇叭：/liuc horn <内容>，需要 liuchat.horn 权限和喇叭余额。
horn:
  # 三种显示分别设置格式；BossBar 使用 title-message-format，控制台跟随 message-format。
  message-format: "&6[全服喇叭] &e${player}&7: &f${message}"
  title-message-format: "&6[全服喇叭] &e${player}&7: &f${message}"
  actionbar-message-format: "&6[全服喇叭] &e${player}&7: &f${message}"
  # 旧版格式保留作兼容回退；新配置优先使用上面三个专用格式。
  format: "&6[全服喇叭] &e${player}&7: &f${message}"
  modes: [chat, title, actionbar, bossbar]
  title: '&6全服喇叭'
  sound: 'BLOCK_NOTE_BLOCK_BELL' # 留空关闭
  duration-ticks: 100

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  # sqlite = 本地文件（plugins/LiuChat/liuchat.db），单服用
  # mysql  = 共享数据库，跨服禁言/解禁需要各子服连同一个库
  type: sqlite
  # 每隔多少秒与数据库对账刷新一次禁言缓存
  # （拿到其他子服写入的禁言/解禁），0 = 关闭
  sync-interval: 30
  mysql:
    host: localhost
    port: 3306
    database: liuchat
    username: root
    password: ""
    # 追加到 jdbc url 的参数
    properties: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8"

# ------------------------------------------------------------
# 聊天冷却，单位秒，0 = 关闭
# 可为不同权限节点单独配置，节点的值直接覆盖 default：
#   权限 liuchat.cooldown.vip1 -> 用 vip1 的值
# 拥有 liuchat.cooldown.bypass 权限直接免除冷却
# ------------------------------------------------------------
chat-cooldown:
  default: 0
  # vip1: 5

# ------------------------------------------------------------
# 重复/相似发言检测
# ------------------------------------------------------------
repeat-check:
  # 检测时间窗口（秒），0 = 关闭；上次发言超过该窗口则不再比较
  time: 30
  # 相似度百分比，100 = 必须完全一致才拦截
  similarity: 95
  # 参与相似度比较的最短消息长度，短于该长度只拦完全相同的；0 = 完全相同也拦
  min-length: 5
  # 含 [i] 物品展示的消息整条跳过：每次展示的物品都可能不同，同文案不算刷屏
