# 聊天节点按配置顺序拼接；${server} ${player} ${world} ${message} 可用。
# ${head} 在 1.21.9+ 客户端显示发送玩家的皮肤头像。
item:
  enable: true
  format: '[i]'
  content: '&7物品展示 &e[ ${item} &e]&7'
  length: 18
  # 灵魂空间戒指展示（需安装 SoulSpace）：点击 [i] 展示的戒指，打开展示者灵魂空间的只读预览。
  # 每台服务器的每个展示条目只在首次点击时读取一次数据（本服在线玩家零 IO），之后点击不读库；
  # 多服部署共用 MySQL 时，任意服务器点开预览读到的都是同一份数据。
  soulspace:
    # 总开关；关闭或未安装 SoulSpace 时，戒指按普通物品展示
    enable: true
    # 识别戒指的 PDC 键（对应 SoulSpace gui.yml 的 gui.ring.pdc-key，默认 soulspace:ring）
    ring-pdc-key: 'soulspace:ring'
    # 点击预览所需权限；无权限点击仍是普通物品预览（未声明的权限默认只有 OP 有，需自行授权）
    preview-permission: 'liuchat.soulspace.preview'
    # 预览默认排序：count-desc 数量从多到少（默认）、count-asc 从少到多、keep 保持空间原顺序。
    # 玩家也可在预览界面点「排序」按钮即时切换（只影响当前界面，翻页保持）
    sort: 'count-desc'

# @ 提及：输入 @玩家ID，或直接输入在线玩家 ID（自动补 @）。
# 被 @ 的玩家会收到提示音；玩家 ID 按 atColor 高亮并保留原消息的颜色/样式。
# 高亮在颜色权限（liuchat.color）裁决之后注入，没有颜色权限的玩家 @ 人同样会变色。
at:
  # 是否开启
  enable: true
  # 音效列表 https://bukkit.windit.net/javadoc/org/bukkit/Sound.html
  sound: BLOCK_ANVIL_LAND
  # 是否保留@符号
  keepAt: true
  # @默认的颜色
  atColor: '&b'

# 私聊格式独立于公共聊天。${player}/${nick} 是发送者，${target} 是接收者。
# 私聊同样支持 [i] 物品展示（包括跨服），点击后打开只读物品预览；需 item.enable 开启。
private:
  enable: true
  to:
    format:
      label:
        text: '&7[私聊] &f你 &7-> '
      player:
        text: '&e${target}&8: '
        clickSuggest: '/tell ${target} '
      msg:
        text: '&f${message}'
  from:
    format:
      label:
        text: '&7[私聊] '
      player:
        text: '&e${head} ${nick} &7-> &f你&8: '
        hover:
          - '&7点击回复 ${player}'
        clickSuggest: '/tell ${player} '
      msg:
        text: '&f${message}'

chat:
  default:
    enable: true
    format:
      server:
        text: '&8[${server}] '
      player:
        text: '&e${head} ${nick}&8» '
        hover:
          - '&7点击传送到 ${player}'
        click: '/tpa ${player}'
      msg:
        text: '&f${message}'
        hover:
          - '&7点击回复 ${player}'
        clickSuggest: '/tell ${player} '
# image.type: background | nameplate，image.id: CustomNameplates 图片 ID（需安装插件和资源包）。
# 仅支持不含 ${message}、${head} 的独立节点；插件/ID 不可用时原样显示节点文本。
# 示例：在 player 节点下使用 text: '&e${nick}'，并添加：
#   image: {type: background, id: bedrock_1, left-margin: 1, right-margin: 1}
# 如需头像，请放在单独节点。
# click 以 / 开头时点击执行；非 / 开头时点击复制；
# clickSuggest 点击填入聊天框；url 点击打开链接。
# 不要在可执行命令中插入玩家消息 ${message}。
