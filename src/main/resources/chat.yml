# 聊天节点按配置顺序拼接；${server} ${player} ${world} ${message} 可用。
# ${head} 在 1.21.9+ 客户端显示发送玩家的皮肤头像。
item:
  enable: true
  format: '[i]'
  content: '&7物品展示 &e[ ${item} &e]&7'
  length: 18

chat:
  default:
    enable: true
    format:
      server:
        text: '&8[${server}] '
      player:
        text: '&e${head} ${nick}&8» '
        hover:
          - '&7点击传送到 ${player}'
        click: '/tpa ${player}'
      msg:
        text: '&f${message}'
        hover:
          - '&7点击回复 ${player}'
        clickSuggest: '/tell ${player} '
# image.type: background | nameplate，image.id: CustomNameplates 图片 ID（需安装插件和资源包）。
# 仅支持不含 ${message}、${head} 的独立节点；插件/ID 不可用时原样显示节点文本。
# 示例：在 player 节点下使用 text: '&e${nick}'，并添加：
#   image: {type: background, id: bedrock_1, left-margin: 1, right-margin: 1}
# 如需头像，请放在单独节点。
# click 以 / 开头时点击执行；非 / 开头时点击复制；
# clickSuggest 点击填入聊天框；url 点击打开链接。
# 不要在可执行命令中插入玩家消息 ${message}。
