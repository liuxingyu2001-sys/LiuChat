# Citizens NPC ID -> AI 助手名（对应 config.yml 的 ai.assistant.profiles）。
# /npc select 后使用 /npc id 查看 ID；只接管列在这里的 NPC 右键。
max-distance: 6
cancel-other-actions: true # 绑定的 NPC 不再同时执行 Citizens 的其他点击操作
# 记忆（多轮上下文）归属开关：不写这项就继承 ai.yml 的 ai.assistant.shared-memory。
# true = 该 NPC 的问答进全服共享会话（其他玩家的提问会当上下文）；
# false = 每个玩家在该 NPC 上各记各的，互不串台。
# shared-memory: true
npcs: {}
#  '12':
#    enable: true
#    assistant: bot
#    title: '向服务器向导提问'
#    shared-memory: false # 只给这一个 NPC 关掉共享记忆，其他 NPC 不受影响
