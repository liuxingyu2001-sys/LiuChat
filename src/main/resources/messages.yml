# 语言文件，${xxx} 为占位符，修改后执行 /lc reload 生效
prefix: "&8[&bLiuChat&8]&r "

no-permission: "&c没有权限执行该命令。"
player-only: "&c该命令只能由玩家执行。"
command.unknown: "&c未知子命令，输入 &e/lc help &c查看帮助。"
command.error: "&c命令执行出错，请联系管理员查看控制台。"
reload.success: "&a配置与语言文件已重载。"

# 帮助（desc 为各子命令在帮助里的说明）
help.header: "&8========== &bLiuChat &8=========="
help.line: "&8» &b/lc ${sub} &8- ${desc}"
help.reload.desc: "&7重载配置与语言文件"
help.mute.desc: "&7禁言玩家 &e/lc mute <玩家> <时长|0永久> [原因]"
help.unmute.desc: "&7解除禁言 &e/lc unmute <玩家>"
help.tell.desc: "&7私聊 &e/lc tell <玩家> <消息>"

# 禁言
mute.permanent: "永久"
mute.default-reason: "未填写"
mute.usage: "&c用法: /lc mute <玩家> <时长|0永久> [原因]"
mute.invalid-time: "&c时间格式无法解析: &e${input} &7(例: 30s / 5m / 1h30m / 0=永久)"
mute.success: "&a已禁言 &e${player} &7时长: &e${time} &7原因: &f${reason}"
mute.notify: "&c你已被禁言 &e${time}&c，原因: &f${reason}"

# 解除禁言
unmute.usage: "&c用法: /lc unmute <玩家>"
unmute.not-muted: "&e${player} &c不在禁言列表中。"
unmute.success: "&a已解除 &e${player} &a的禁言。"

# 聊天拦截
chat.muted: "&c你处于禁言状态，剩余 &e${time}&c，原因: &f${reason}"
chat.cooldown: "&c发言太快，请等待 &e${time} &c秒。"
chat.repeat: "&c请勿在短时间内重复发送相同或相似内容。"

# 私聊
tell.usage: "&c用法: /lc tell <玩家> <消息>"
tell.self: "&c不能和自己私聊。"
tell.offline: "&c玩家 &e${player} &c不在线。"
tell.to-tell: "&7[私聊] &f你 &7-> &e${player}&8: &f${message}"
tell.from: "&7[私聊] &e${player} &7-> &f你&8: &f${message}"
